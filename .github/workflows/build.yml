name: Gerar APK
on:
  push:
    paths-ignore: ['ios/**', 'web/**', 'web-tests/**', '.github/workflows/ios.yml', '.github/workflows/web.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk MeusGastos.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MeusGastos-apk
          path: MeusGastos.apk
      # Publica o APK numa "release" para baixar direto pelo celular
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Meus Gastos 1.0.${{ github.run_number }}
          body: Baixe o arquivo MeusGastos.apk abaixo e abra no celular para instalar.
          files: MeusGastos.apk
          make_latest: true
